name: Flask CI/CD Pipeline

# Pipeline Triggers - defines when this workflow will run
on:
  # Automatic trigger on pushes to specific branches
  push:
    branches:
      - main          # Production branch - triggers full deployment pipeline
      - develop       # Development branch - integration testing
      - 'feature/**'  # Feature branches - early feedback during development
      - 'hotfix/**'   # Hotfix branches - urgent production fixes
  
  # Automatic trigger on pull requests targeting main branches
  pull_request:
    branches:
      - main          # PRs to production - thorough validation required
      - develop       # PRs to development - integration validation
  
  # Manual trigger - allows on-demand pipeline execution with custom parameters
  workflow_dispatch:
    inputs:
      run_smoke_tests:
        description: 'Run smoke tests - uncheck for faster pipeline execution'
        required: false
        default: true
        type: boolean
      unit_tests_only:
        description: 'Run unit tests only (skip deploy/K8s/smoke)'
        required: false
        default: false
        type: boolean
      demo_message:
        description: 'Custom message for demo (optional)'
        required: false
        default: 'Manual demo run'
        type: string

# Environment variables available to all jobs
env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE_NAME: hello-flask
  REGISTRY: docker.io
  REPO_ENVIRONMENT: test

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Prevent stuck jobs from running indefinitely

    # Security: Limit permissions to minimum required
    permissions:
      contents: read        # Read repository contents
      actions: read         # Read workflow artifacts
      pull-requests: write  # Comment on PRs with results

    # Environment variables for this job
    env:
      MINIKUBE_DRIVER: docker
      KUBERNETES_VERSION: v1.28.0

    steps:
      # --- Step 1: Checkout the repo ---
      - name: Checkout repository
        uses: actions/checkout@v5  # Updated to latest major version
        timeout-minutes: 5

      # --- Step 2: Setup Python ---
      - name: Set up Python
        uses: actions/setup-python@v6  # Updated to latest major version
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Safe pip cache restore (optional). Guarded so it won't fail on forks or when cache is unavailable.
      - name: Restore pip cache (safe)
        if: ${{ env.ACTIONS_CACHE_URL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask-k8s/app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Safe Python virtualenv restore. If cache is unavailable or from a fork, this is skipped and the next step will create the venv.
      - name: Restore Python virtualenv (safe)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: flask-k8s/.venv
          key: ${{ runner.os }}-venv-py${{ env.PYTHON_VERSION }}-${{ hashFiles('flask-k8s/app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-py${{ env.PYTHON_VERSION }}-

      # --- Step 3: Install dependencies ---
      - name: Install Python dependencies (venv)
        timeout-minutes: 10
        working-directory: flask-k8s
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r app/requirements.txt pytest requests
        
      # --- Step 4: Setup Docker & Minikube ---
      - name: Setup Docker
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      # Prepare buildx cache directories so build works even without a restored cache
      - name: Prepare buildx cache dirs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.unit_tests_only != true }}
        run: mkdir -p /tmp/.buildx-cache /tmp/.buildx-cache-new

      # Caching note:
      # We point the Docker CLI at Minikube's docker daemon (eval "$(minikube -p minikube docker-env)").
      # This uses the buildx "docker" driver, which DOES NOT support exporting/importing cache to a local directory
      # (type=local). Attempting to use --cache-to/--cache-from with type=local causes buildx to exit with:
      #   "Cache export is not supported for the docker driver. Switch to a different driver, or turn on the containerd image store..."
      # The restore step is kept here for future use if we switch to a cache-capable driver; it is guarded and non-blocking.
      # Safe Docker layer cache restore (optional). Guarded so it won't fail on forks or when cache is unavailable.
      - name: Restore Docker layer cache (safe)
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.unit_tests_only != true) }}
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Start Minikube
        # uses: medyagh/setup-minikube@v0.0.16  # previous version (commented)
        uses: medyagh/setup-minikube@e3c7f79eb1e997eabccc536a6cf318a2b0fe19d9 # v0.0.20
        timeout-minutes: 15
        with:
          minikube-version: 1.32.0
          kubernetes-version: ${{ env.KUBERNETES_VERSION }}
          driver: docker
          cpus: 2
          memory: 4g
          
      # --- Step 5: Build Docker Image ---
      - name: Build Docker image
        timeout-minutes: 20
        working-directory: flask-k8s
        run: |
          set -euxo pipefail
          echo "Configuring shell to use Minikube's docker daemon"
          # Point Docker CLI to Minikube's docker daemon so the image is built directly into Minikube
          eval "$(minikube -p minikube docker-env)"

          # Build Docker image WITHOUT buildx cache flags.
          # Reason: With the docker driver (Minikube's docker daemon), buildx does not support local cache export/import,
          # which causes failures when using --cache-to/--cache-from type=local. Using plain `docker build` avoids that.
          docker build \
            -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.DOCKER_IMAGE_NAME }}:latest \
            app/

      # --- Step 6: Deploy app (always deploy except for PRs) ---
      - name: Deploy app
        timeout-minutes: 60
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.unit_tests_only != true) }}
        working-directory: flask-k8s
        run: |
          set -euxo pipefail
          echo "===== Starting deploy_local.sh (trace enabled) ====="
          # keep the deploy output in a log file; collect diagnostics on failure
          bash -x scripts/deploy_local.sh &> deploy.log || {
            echo "Deploy script failed — printing last 200 lines of deploy.log"
            tail -n 200 deploy.log || true
            echo "Cluster PODS:"
            minikube kubectl -- get pods -A -o wide || true
            exit 1
          }
          echo "Deploy script completed, waiting for rollout..."
          # explicit rollout wait to fail gracefully if not ready
          minikube kubectl -- rollout status deployment/hello-flask --timeout=5m || {
            echo "Rollout did not complete within 5m — dumping pods and events"
            minikube kubectl -- get pods -A -o wide || true
            minikube kubectl -- describe pod -l app=hello-flask || true
            minikube kubectl -- get events -A --sort-by='.metadata.creationTimestamp' | tail -n 200 || true
            exit 1
          }
          echo "Deploy successful"

      # --- Step 7: Wait for deployment readiness ---
      - name: Wait for deployment to be ready
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.unit_tests_only != true) }}
        timeout-minutes: 10
        run: |
          echo "Waiting for pods to be ready..."
          minikube kubectl -- wait --for=condition=ready pod -l app=hello-flask --timeout=300s

      # --- Step 8: Run Unit Tests ---
      - name: Run unit tests
        id: unit-tests
        timeout-minutes: 10
        continue-on-error: true  # Don't stop workflow if unit tests fail
        working-directory: flask-k8s
        run: bash scripts/unit_tests.sh

      # --- Step 9: Run Kubernetes tests (skip for PRs) ---
      - name: Run Kubernetes tests
        id: k8s-tests
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.unit_tests_only != true) }}
        timeout-minutes: 20
        continue-on-error: true  # Don't stop workflow if K8s tests fail
        working-directory: flask-k8s
        run: bash scripts/k8s_tests.sh

      # --- Step 10: Run Smoke Tests (conditional) ---
      # Skip for PRs, runs for pushes and manual triggers (unless disabled)
      - name: Run smoke tests
        id: smoke-tests
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.run_smoke_tests == true && inputs.unit_tests_only != true)) }}
        timeout-minutes: 15
        continue-on-error: true  # Don't stop workflow if smoke tests fail
        working-directory: flask-k8s
        run: bash scripts/smoke_test.sh

      # --- Step 11: Upload test artifacts ---
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests failed
        with:
          name: test-results-${{ github.run_number }}
          path: |
            flask-k8s/test-reports/
            flask-k8s/logs/
            flask-k8s/*.log
          retention-days: 30

      # --- Step 12: Upload deployment diagnostics ---
      # Upload Minikube and deployment logs for troubleshooting
      - name: Upload deployment diagnostics
        if: always()  # Upload even if deployment failed
        uses: actions/upload-artifact@v4
        with:
          name: minikube-deploy-logs-${{ github.run_number }}
          path: |
            flask-k8s/logs/
            flask-k8s/deploy.log
          retention-days: 7

      # --- Step 13: Cleanup (Always Runs) ---
      # This step runs regardless of previous step failures to ensure resource cleanup
      - name: Cleanup Minikube resources
        if: always()  # Always run cleanup, even if previous steps failed
        timeout-minutes: 10
        working-directory: flask-k8s
        run: bash scripts/delete_local.sh

      # --- Step 14: Report Test Results ---
      # Check if any tests failed and fail the workflow accordingly
      - name: Check test results and report status
        if: always()  # Always run to properly report final status
        run: |
          echo "=== 📊 Test Results Summary ==="
          echo "Repository Environment: ${{ env.REPO_ENVIRONMENT }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "🚀 PR Mode: Running unit tests only (fast validation)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.unit_tests_only }}" == "true" ]]; then
            echo "🧪 Manual Mode (unit-tests-only): Skipping deployment, Kubernetes, and smoke tests"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Demo Message: ${{ inputs.demo_message }}"
          fi
          echo ""
          
          # Check unit tests
          if [[ "${{ steps.unit-tests.outcome }}" == "failure" ]]; then
            echo "❌ Unit tests failed"
            TESTS_FAILED=true
          else
            echo "✅ Unit tests passed"
          fi
          
          # Check K8s tests (skipped for PRs and unit-tests-only manual runs)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "⏭️ Kubernetes tests skipped (PR mode - unit tests only)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.unit_tests_only }}" == "true" ]]; then
            echo "⏭️ Kubernetes tests skipped (manual unit-tests-only mode)"
          elif [[ "${{ steps.k8s-tests.outcome }}" == "failure" ]]; then
            echo "❌ Kubernetes tests failed"
            TESTS_FAILED=true
          else
            echo "✅ Kubernetes tests passed"
          fi
          
          # Check smoke tests (skipped for PRs, unit-tests-only, and when manually disabled)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "⏭️ Smoke tests skipped (PR mode - unit tests only)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.unit_tests_only }}" == "true" ]]; then
            echo "⏭️ Smoke tests skipped (manual unit-tests-only mode)"
          elif [[ "${{ steps.smoke-tests.outcome }}" == "failure" ]]; then
            echo "❌ Smoke tests failed"
            TESTS_FAILED=true
          elif [[ "${{ steps.smoke-tests.outcome }}" == "success" ]]; then
            echo "✅ Smoke tests passed"
          else
            echo "⏭️ Smoke tests skipped"
          fi
          
          echo ""
          
          # Fail the workflow if any tests failed
          if [[ "$TESTS_FAILED" == "true" ]]; then
            echo "❌ Pipeline failed due to test failures"
            echo "::error title=Tests Failed::One or more test suites failed. Check the logs above for details."
            exit 1
          else
            echo "✅ All tests passed successfully! 🎉"
            echo "::notice title=All Tests Passed::Pipeline completed successfully with all tests passing."
          fi

  # Security scanning job (runs in parallel)
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Cache Trivy vulnerability database to speed up scans (safe)
      - name: Restore Trivy DB cache (safe)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scanner
        env:
          TRIVY_CACHE_DIR: ~/.cache/trivy
        # uses: aquasecurity/trivy-action@0.28.0  # previous version (commented)
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # 0.34.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
